[package]
name = "proton-mail-mac-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A local MCP bridge for Proton Mail on macOS"
license = "MIT"
repository = "https://github.com/ryanpaulanderson/proton-mail-mac-mcp"
publish = false

[[bin]]
name = "proton-mail-mac-mcp"
path = "src/main.rs"

[dependencies]

async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1.91"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.5", features = ["derive"] }
directories = "6.0.0"
email_address = "0.2.9"
futures = "0.3.33"
getrandom = "0.4.3"
infer = "0.22.0"
mail-builder = "0.5.0"
mail-parser = "0.11.5"
native-tls = "0.2.14"
rmcp = { version = "3.1.1", features = ["transport-io"] }
rpassword = "7.4.0"
schemars = { version = "1.2.2", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-native-tls = "0.3.1"
toml = "1.1.4"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.24"
zeroize = { version = "1.9.0", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
security-framework-sys = "2.17.0"

[lints.rust]
unsafe_code = "forbid"
