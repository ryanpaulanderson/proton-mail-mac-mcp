version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 3 * * *"
      timezone: America/New_York
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 3 * * *"
      timezone: America/New_York
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
